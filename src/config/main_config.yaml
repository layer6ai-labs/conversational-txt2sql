# BIRD-Interact Agentic Framework Configuration

# Project settings
project:
  name: "bird-interact"
  version: "1.0.0"
  root_path: "/path/to/your/project"  # Replace with actual path
  experiment_id: null  # Auto-generated if not provided

# Model configurations
models:
  system_model:
    name: "gpt-4.1-mini"
    temperature: 0.1
    max_tokens: 4000
    timeout: 60
    retry_attempts: 3
    
  user_simulator_model:
    name: "gpt-4.1-mini" 
    temperature: 0.3
    max_tokens: 2000
    timeout: 45
    retry_attempts: 3

# Pipeline parameters
pipeline:
  patience: 3
  max_concurrent_requests: 5
  enable_caching: true
  
  # Phase configuration
  phases:
    ambiguity_resolution:
      enabled: true
      max_turns: 5
      
    debugging:
      enabled: true
      max_attempts: 1
      
    follow_up:
      enabled: true
      generate_questions: true
      
    follow_up_debugging:
      enabled: true
      max_attempts: 1

# Data paths (relative to project root)
data:
  input:
    base_data: "bird_interact_conv/data/bird-interact-lite/bird_interact_data.jsonl"
    db_schema_template: "bird_interact_conv/data/bird-interact-lite/[[DB_name]]/[[DB_name]]_schema.txt"
    external_kb_template: "bird_interact_conv/data/bird-interact-lite/[[DB_name]]/[[DB_name]]_kb.jsonl"
    
  output:
    base_dir: "results"
    # Results will be organized as: base_dir/patience_{patience}/{model_name}/
    
  file_patterns:
    system_interaction: "system_interaction.jsonl"
    system_prompt: "system_interaction_prompt.jsonl" 
    system_response: "system_interaction_response.jsonl"
    user_1_interaction: "user_1_interaction.jsonl"
    user_1_prompt: "user_1_interaction_prompt.jsonl"
    user_1_response: "user_1_interaction_response.jsonl"
    user_2_interaction: "user_2_interaction.jsonl"
    user_2_prompt: "user_2_interaction_prompt.jsonl"
    user_2_response: "user_2_interaction_response.jsonl"
    sql_results: "sql_results.jsonl"
    sql_results_debug: "sql_results_debug.jsonl"
    sql_results_fu: "sql_results_fu.jsonl"
    sql_results_fu_debug: "sql_results_fu_debug.jsonl"

# Agent configurations
agents:
  system_agent:
    prompt_templates_dir: "prompts/system"
    sql_extraction_enabled: true
    
  user_simulator:
    parser:
      prompt_templates_dir: "prompts/user_parser"
      
    generator:
      prompt_templates_dir: "prompts/user_generator"

# Evaluation settings
evaluation:
  enabled: true
  script_path: "evaluation/src/eval_bird_interact_batch.py"
  output_suffix: "_output_with_status.jsonl"
  
  # Metrics to compute
  metrics:
    - "execution_accuracy"
    - "valid_efficiency" 
    - "sql_syntax_correctness"

# API settings
api:
  rate_limiting:
    requests_per_minute: 100
    requests_per_hour: 1000
    
  retry_config:
    max_retries: 3
    backoff_factor: 2
    max_backoff: 60

# Logging configuration  
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  handlers:
    console:
      enabled: true
      level: "INFO"
      
    file:
      enabled: true  
      level: "DEBUG"
      filename: "logs/pipeline.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5
      
  loggers:
    agents: "DEBUG"
    pipeline: "INFO"
    utils: "WARNING"

# Error handling
error_handling:
  continue_on_failure: false
  save_partial_results: true
  max_consecutive_failures: 3
  
  # What to do when files are empty
  empty_file_strategy: "skip"  # skip, retry, fail

# Monitoring and observability
monitoring:
  track_metrics: true
  save_intermediate_results: true
  
  # Progress tracking
  progress:
    enabled: true
    update_frequency: 10  # Update every N processed items
    
  # Performance tracking  
  performance:
    track_timing: true
    track_memory_usage: false
    profile_enabled: false

# Development and debugging
development:
  debug_mode: false
  dry_run: false
  limit_samples: null  # Set to number to limit for testing
  
  # Debugging specific phases
  debug_phases:
    ambiguity_resolution: false
    follow_up: false
    
# Environment-specific overrides
environment: "development"  # development, staging, production

# Feature flags
features:
  parallel_processing: true
  async_api_calls: true
  result_caching: true
  schema_validation: true

credentials:
  openai_api_key: "env:OPENAI_API_KEY"