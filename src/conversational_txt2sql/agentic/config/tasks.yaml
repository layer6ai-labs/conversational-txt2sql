generate_sql:
  description: >
    Generate a highly accurate, efficient, and ready-to-run PostgreSQL SQL query that directly and completely answers the user's question. Use only the information provided in the supplied schema context, column descriptions, and external definitions—do not reference or assume any undocumented tables, columns, or relationships.

    Detailed Instructions:
    - Carefully analyze the user's question to identify key intents, target entities, filters, conditions, and required outputs.
    - Work strictly within the provided documentation for {db}: 
        * Use only tables, columns, and relationships explicitly found in the schema context, column descriptions, or external knowledge.
        * Never invent or speculate about missing schema elements.
    - Adhere to all documented data types, primary keys, foreign keys, and constraints.
    - Accurately map ambiguous or vague phrases to the best matching schema elements based on names and descriptions.
    - Leverage PostgreSQL best practices throughout:
        * Use ILIKE (not LIKE) for case-insensitive searches.
        * Use aggregations, subqueries, window functions, and computations only when directly required.
        * Avoid extraneous joins, redundancy, or unnecessary complexity—minimize the scope of the query to what is necessary.
    - Ensure the output contains only the requested columns and data, with clean formatting.
    - Exclude ALL explanations, comments, or extra text. Your output must be only the SQL statement.
    - If documentation gaps exist, make the most reasonable data-driven assumption to meet the user's intent, but never invent schema details.
    - Wrap your answer in <SQL> ... </SQL> tags and provide nothing outside that block.

    # User's Question:
    {user_question}

    # Database Schema Context:
    {db_schema}

    # Column Meanings and Descriptions (if any):
    {column_descriptions}

    # Definitions and External Knowledge (if any):
    {knowledge}

  expected_output: >
    A single, concise, well-formatted PostgreSQL SQL query that fully addresses the user's request. The query should be optimal, syntactically correct, and use only the supplied database documentation. No extra explanations or text.
  agent: sql_generator


execute_debug_sql:
  description: >
    Run, evaluate, and intelligently debug a provided PostgreSQL SQL query against the designated database. The query will always be found within <SQL> ... </SQL> tags.

    Step-by-step instructions:

    - Carefully extract and execute the SQL inside the <SQL> ... </SQL> block, strictly within the context of the given schema, column definitions, and knowledge.
    - If execution succeeds:
        * Present the full result set in a clearly legible tabular (pandas dataframe) format—with correct column headers and a preview of the data.
        * Confirm the query's success, indicating if results are empty or if a subset of rows is shown.
    - If execution fails:
        * Report the precise error message as received from the database.
        * Diagnose the failure, providing a root-cause explanation (such as syntax errors, missing or misnamed tables/columns, constraint violation, data type mismatch, or permission issues).
        * Step through to debug the SQL:
          - Suggest—and if possible, provide—a corrected query, making only contextually valid changes grounded in the supplied schema and documentation.
          - Avoid guessing or fabricating any tables, columns, or logic not present in the provided schema.
          - Wrap any proposed fix in <SQL> ... </SQL> tags only if submitting a full revised query.
        * If the issue cannot be resolved, summarize attempts and optionally request assistance from the sql_generator agent with a clear, actionable summary of the problem.
    - For every suggestion or error explanation, be concise, technically robust, and actionable—prioritizing fast resolution and learning.

    Collaboration guideline:
      - If you encounter ambiguous errors or repeated failures, you may communicate directly with the sql_generator agent, providing context and what you have tried so far.

    # SQL Query to execute (between <SQL> and </SQL> tags):
    # [SQL is supplied in the <SQL> ... </SQL> block.]

    # Database being queried:
    {db}

    # After execution, provide outputs and reasoning below this point:

  expected_output: >
    The FINAL RESULT as a pandas dataframe.

    - For failed queries: a clear error message, root cause analysis, and a revised SQL query suggestion wrapped in <SQL> ... </SQL> tags if possible.
    - If no fix is possible: a concise summary of failure, and (optionally) a referral back to the sql_generator agent.
  agent: sql_executor_debugger
  context: [generate_sql]

generate_plan:
  description: >
    Analyze the user question and produce a clear, numbered plan of steps needed to answer it using SQL.
  expected_output: >
    A structured list of steps, each describing part of the SQL strategy.
  agent: planner

generate_atomic_sql:
  description: >
    Take the plan produced by the planner and translate it into a complete SQL query. 
    Decompose complex requirements into simple SQL building blocks before composing.
  expected_output: >
    A single SQL query wrapped in <SQL> tags.
  agent: decomposer
  context: [generate_plan]

verify_sql:
  description: >
    Check the generated SQL for syntax errors, schema mismatches, or missing elements before execution.
    If issues exist, return structured feedback.
  expected_output: >
    Either "Verified OK" or detailed error feedback that can be looped back to the decomposer.
  agent: verifier
  context: [generate_atomic_sql]
