version: "3.8"

services:
  
  postgresql:
    build:
      context: .
      dockerfile: ./Dockerfile.postgresql
    container_name: txt2sql_postgresql
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123123
      TZ: "America/Toronto"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ../../data/postgre_table_dumps:/docker-entrypoint-initdb.d/postgre_table_dumps
    command:
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
    ports:
      - "5432:5432"
  
volumes:
  postgresql_data:

