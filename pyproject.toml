[project]
name = "conversational_txt2sql"
version = "0.1.0"
description = "MultiModal AI Bootcamp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.109.1",
    "psycopg2>=2.9.10",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
    "sqlglot>=27.19.0",
    "tqdm>=4.67.1",
]

[project.scripts]
txt2sql_pipeline = "conversational_txt2sql.main_pipeline:main"
# ui = "conversational_txt2sql.ui:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]
ui = [
    "streamlit>=1.50.0",
]

[database]
host = "localhost"
port = 5432
user = "root"
password = "123123"
